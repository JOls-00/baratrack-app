  shared_preferences: ^2.3.5
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
