publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  args: ^2.7.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  intl: ^0.19.0
  file_picker: ^8.1.7
